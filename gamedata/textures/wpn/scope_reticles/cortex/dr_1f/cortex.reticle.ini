; March DR-1F, the same drawing as shorty/dr_1f (3DSS ships one bitmap at both paths); the 3DSS profile
; cortex_dr_1f shows it and the sight's Mark Switch colours light the dot.

[reticle]
units = mil
scale = 1
; the 3DSS bitmap is 8192 px at 23.3 px per MIL: the reticle shows at that bitmap's size, and its fixed-size
; parts match the scale at the lowest zoom (1x), where March gives their sizes
legacy_span = 351.588

[illumination]
luminance = 8
glow_strength = 1
