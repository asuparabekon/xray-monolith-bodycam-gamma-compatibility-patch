; March DR-1F, a dual focal plane reticle in MIL: the ranging scale grows with the zoom; the crosshair and the
; fibre dot (light only: unseen while the illumination is off) keep their size. Line widths and the dot from
; March's drawing (marchscopes.com DR-1F.jpg), tick positions and lengths, bar positions and numerals from the
; 3DSS bitmap at this path (3DSS reticle type 9). The 3DSS profiles shorty_dr_1f (March F Shorty 1-10x) and
; cortex_dr_1f show it; the sights' Mark Switch colours light the dot.

[reticle]
units = mil
scale = 1
; the 3DSS bitmap is 8192 px at 23.3 px per MIL: the reticle shows at that bitmap's size, and its fixed-size
; parts match the scale at the lowest zoom (1x), where March gives their sizes
legacy_span = 351.588

[illumination]
luminance = 8
glow_strength = 1
