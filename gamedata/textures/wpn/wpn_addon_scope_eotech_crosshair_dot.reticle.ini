; The 3DSS EOTech holographic reticle (eot = 552, e0t2 = XPS3, exps3 = EXPS3 and their magnifier combos all
; use this one texture). Six Mark Switch marks in the order of the 3DSS bitmap's grid; the sights define no
; ms_colors, so each mark lights in its own colour from the drawing (red, green, red, red, red, red). See the
; SVG for where each size comes from.

[reticle]
units = moa
scale = 1
; drawn at the size the 3DSS bitmap shows: its ring centre line is 82 px from the centre of a 1024 px Mark
; Switch cell, 34 MOA here
legacy_span = 424.6

[illumination]
colour = drawing
; leave headroom for bright laser grains instead of washing the whole ring white
luminance = 0.75
glow_strength = 0.45
glow_size = 0.55

[holo]
softness = 1.25
level = 0.75

[mask]
; laser speckle: 4 px grains of 1.8 MOA (256 px per 115 MOA), shifting 0.23 grains per mm of eye movement
image = wpn_addon_scope_eotech_crosshair_dot_speckle.png
depth = 0.95
size = 115
eye_shift = 0.41
